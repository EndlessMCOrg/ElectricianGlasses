modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
displayURL = "${mod_url}"
issueTrackerURL = "${mod_url}issues"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[mixins]]
config = "${mod_id}.mixins.json"

[[dependencies."${mod_id}"]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "powergrid"
type = "optional"
versionRange = "[0.6.0.1,)"
ordering = "AFTER"
side = "SERVER"

[[dependencies."${mod_id}"]]
modId = "curios"
type = "optional"
versionRange = "[9.5.1,)"
ordering = "AFTER"
side = "BOTH"
